name: Update Daily Cybersecurity News

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest cybersecurity news feeds
        run: python3 scripts/fetch_news.py

      - name: Commit and push updated public/news.json
        run: |
          if git diff --quiet public/news.json; then
            echo "No changes to public/news.json."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/news.json
            git commit -m "chore: update daily cybersecurity news feed"
            git push origin main
          fi
